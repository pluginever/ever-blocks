name: Test
on:
  push:
    branches:
      - develop
      - release/*
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
jobs:
  test:
    name: WordPress ${{ matrix.wordpress }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress:
          - "7.1"
          - trunk
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ever_blocks_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer, wp-cli
          coverage: none

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: |
          composer install --no-interaction --prefer-dist
          pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: |
          composer phpcs
          composer phpstan
          pnpm lint:js
          pnpm lint:css
          pnpm typecheck

      - name: JavaScript tests
        run: pnpm test:unit

      - name: PHP tests
        run: |
          bash ./tests/bin/install.sh ever_blocks_test root root 127.0.0.1 ${{ matrix.wordpress }}
          composer test
